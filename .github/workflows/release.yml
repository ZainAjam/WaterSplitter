name: Release

# Publishes a signed APK as a GitHub release whenever a version tag such as v0.3.0 is pushed.
# The app on the phone checks this repository's latest release for updates.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the tests
        run: |
          chmod +x ./gradlew
          ./gradlew :engine:test --console=plain

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK
        env:
          WEWRC_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          WEWRC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WEWRC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WEWRC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :app:assembleRelease \
            "-PappVersionName=${VERSION}" \
            "-PappVersionCode=${{ github.run_number }}" \
            "-Pwewrc.updateRepo=${{ github.repository }}" \
            "-Pwewrc.updateToken=${{ secrets.UPDATE_TOKEN }}" \
            --console=plain
          cp app/build/outputs/apk/release/app-release.apk "water-split-${VERSION}.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: water-split-*.apk
          generate_release_notes: true
          # Every 0.x version is a prerelease (the app's updater looks at prereleases too).
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
